name: Coverage 

on:
  push:
    branches:
      - gh-actions
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Conda env
        uses: conda-incubator/setup-miniconda@v2
        with:
          activate-environment: seq-detective
          mamba-version: "*"
          python-version: '3.9'
          channels: conda-forge 
        

      - name: Install dependencies
        shell: bash -el {0}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make gcc time
          mamba install meson ninja gcovr cmake
      - name: Build
        shell: bash -el {0}
        run: |
          make
          meson configure build -Dtest=enabled -Db_coverage=true    
   
      - name: Run Test Suite  
        shell: bash -el {0}
        run: |
          meson test -C build

      - name: Generate Coverage
        shell: bash -el {0}
        run: | 
          ninja coverage-text -C build
          echo "=======Coverage Report======="
          cat build/meson-logs/coverage.txt
      - name: Upload coverage logs
        uses: actions/upload-artifact@v4
        with:
          name: coverage-logs
          path: build/meson-logs


