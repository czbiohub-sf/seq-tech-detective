name: Coverage 

on:
  workflow_dispatch:
  push:
    branches:
      - gh-actions
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest","macos-latest"]
        # ,"macos-latest"]
        python-version: ["3.9"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # - name: Set up Conda env
      #   uses: mamba-org/setup-micromamba@v2 
      #   with:
      #     # generate-run-shell: true
      #     environment-name: seq-detective
      #     # channels: conda-forge, bioconda 
      #     create-args: >-
      #       meson 
      #       ninja 
      #       make 
      #       gcc 
      #       time 
      #       cxx-compiler
      #       cmake
      #       gcovr
      #     # auto-activate-base: false
      #     cache-environment: true
      #     post-cleanup: 'all'
      - name: Set up Conda env for Linux
        uses: mamba-org/setup-micromamba@v2
        if: runner.os == 'Linux'
        with:
          # generate-run-shell: true
          environment-name: seq-detective
          # channels: conda-forge, bioconda
          create-args: >-
            meson 
            ninja 
            make 
            gcc 
            time 
            cxx-compiler
            cmake
            gcovr
          # auto-activate-base: false
          cache-environment: true
          post-cleanup: 'all'
      
      - name: Set up Conda env for macOS
        uses: mamba-org/setup-micromamba@v2
        if: runner.os == 'macOS'
        with:
          # generate-run-shell: true
          environment-name: seq-detective
          # channels: conda-forge, bioconda
          create-args: >-
            meson 
            ninja 
            make
            clang
            time 
            cxx-compiler
            llvm-openmp
            cmake
            gcovr
          # auto-activate-base: false
          cache-environment: true
          post-cleanup: 'all'
      
      
 

      - name: Build
        run: |
           micromamba run -n seq-detective make
           micromamba run -n seq-detective meson configure build -Dtest=enabled -Db_coverage=true    
   
      - name: Run Test Suite  
        run: |
          micromamba run -n seq-detective meson test -C build

      - name: Generate Coverage
        run: | 
          micromamba run -n seq-detective ninja coverage-text -C build
          echo "=======Coverage Report======="
          cat build/meson-logs/coverage.txt
      
      - name: Upload coverage logs for Linux 
        uses: actions/upload-artifact@v4
        if: runner.os =='Linux'
        with:
          name: coverage-logs-linux
          path: build/meson-logs
      
      - name: Upload coverage logs for macOS
        uses: actions/upload-artifact@v4
        if: runner.os =='macOS'
        with:
          name: coverage-logs-macos
          path: build/meson-logs



