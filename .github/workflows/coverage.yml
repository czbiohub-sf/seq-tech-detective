name: Coverage 

on:
  workflow_dispatch:
  push:
    branches:
      - gh-actions
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest","macos-latest"]
        # ,"macos-latest"]
        python-version: ["3.9"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Conda env for Linux
        uses: mamba-org/setup-micromamba@v2
        if: runner.os == 'Linux'
        with:
          # generate-run-shell: true
          environment-name: seq-detective
          environment-file: environment.yml
          create-args: >- 
            gcc 
            cmake
            gcovr
          post-cleanup: 'all'
      
      - name: Set up Conda env for macOS
        uses: mamba-org/setup-micromamba@v2
        if: runner.os == 'macOS'
        with:
          environment-name: seq-detective
          environment-file: environment.yml
          create-args: >-
            clang
            llvm-openmp
            cmake
            gcovr
          post-cleanup: 'all'
      - name: Install sra-tools for macOS
        if: runner.os == 'macOS'
        run: | 
          micromamba run -n seq-detective micromamba install sra-tools -c bioconda --platform osx-64 -y
      - name: Install sra-tools for Linux 
        if: runner.os == 'Linux'
        run: | 
          micromamba run -n seq-detective micromamba install sra-tools -c bioconda -y
      
      - name: Install make for macOS
        if: runner.os == 'macOS'
        run: |
          brew install make 
      - name: Install make for Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt install make 

      
      - name: Build
        run: |
           micromamba run -n seq-detective make
           micromamba run -n seq-detective meson configure build -Dtest=enabled -Db_coverage=true    
   
      - name: Run Test Suite  
        run: |
          micromamba run -n seq-detective meson test -C build

      - name: Generate Coverage
        run: | 
          micromamba run -n seq-detective ninja coverage-text -C build
          echo "=======Coverage Report======="
          cat build/meson-logs/coverage.txt
      
      - name: Upload coverage logs for Linux 
        uses: actions/upload-artifact@v4
        if: runner.os =='Linux'
        with:
          name: coverage-logs-linux
          path: build/meson-logs
      
      - name: Upload coverage logs for macOS
        uses: actions/upload-artifact@v4
        if: runner.os =='macOS'
        with:
          name: coverage-logs-macos
          path: build/meson-logs



