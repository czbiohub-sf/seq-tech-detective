name: Coverage 

on:
  push:
    branches:
      - gh-actions
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
        
      - name: Create and start python virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate 
          

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make gcc time
          pip install meson ninja gcovr cmake
      - name: Build
        run: |
          # Adjust this command to match your project's build steps
          make
          meson configure build -Dtest=enabled -Db_coverage=true    
   
      - name: Run Test Suite 
        run: |
          meson test -C build

      - name: Generate Coverage
        run: | 
          ninja coverage-text -C build
      - name: Upload coverage logs
        uses: actions/upload-artifact@v4
        with:
          name: coverage-logs
          path: build/meson-logs


