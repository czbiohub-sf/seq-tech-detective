name: Build_time

on:
  push:
    branches:
      - gh-actions
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Conda env
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: seq-detective
          mamba-version: "*"
          python-version: '3.9'
          channels: conda-forge 
          
      - name: Install dependencies
        shell: bash -el {0}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make gcc time
          mamba install meson ninja 
      

      - name: Build
        shell: bash -el {0}
        run: |
          # Adjust this command to match your project's build steps
          /usr/bin/time -v sh -c '
          make
          meson compile -C build
          '
      - name: Archive build artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled_tool
          compression-level: 6
          if-no-files-found: error
          path: |
            *
            #build/seq-detective-fp
            #resources/


  runtime:
    runs-on: ubuntu-latest
    needs: build
    steps:

      - name: Check out repository 
        uses: actions/checkout@v4
        
      - name: Download compiled artifact
        uses: actions/download-artifact@v4
        with: 
          name: compiled_tool
          path: . 

      - name: make binary executable
        run: chmod +x build/seq-detective-fp

      - name: ensure GNU time is installed
        run: | 
          sudo apt-get update
          sudo apt-get install -y time

      - name: List available test FASTQ files
        run: | 
          echo "Available FASTQ files in data/tests/workflow_data/:"
          ls -l resources/tests/500/
      - name: Run tool on tests fastqs
        run: | 
          for file in resources/tests/500/*.fastq; do
            filename=$(echo "${file}"| awk -F/ '{print $5}')  
            echo "=== Running seq-detective on ${file} from ${PWD} ==="
            /usr/bin/time -v build/seq-detective-fp ${file}
            echo "-------------------------------------"
            echo ""
          done
    
