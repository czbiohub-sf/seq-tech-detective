name: Build_time

on:
  workflow_dispatch:
  push:
    branches:
      - gh-actions
      - main
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest","macos-latest"]
        python-version: ["3.10"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Conda env for Linux
        uses: mamba-org/setup-micromamba@v2
        if: runner.os == 'Linux'
        with:
          environment-name: seq-detective
          environment-file: environment.yml
          create-args: >-
            gcc 
          post-cleanup: 'all'
      
      - name: Set up Conda env for macOS
        uses: mamba-org/setup-micromamba@v2
        if: runner.os == 'macOS'
        with:
          environment-name: seq-detective
          environment-file: environment.yml
          create-args: >-
            clang
            llvm-openmp
            --platform osx-64
          post-cleanup: 'all'
     
      # - name: Install sra-tools for macOS
      #   if: runner.os == 'macOS'
      #   run: | 
      #     micromamba run -n seq-detective micromamba install sra-tools -c bioconda --platform osx-64 -y
      # - name: Install sra-tools for Linux 
      #   if: runner.os == 'Linux'
      #   run: | 
      #     micromamba run -n seq-detective micromamba install sra-tools -c bioconda -y
      #
      - name: Install make for macOS
        if: runner.os == 'macOS'
        run: |
          brew install make 
      - name: Install make for Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt install make 



      - name: Verify env 
        run: |
          micromamba run -n seq-detective meson --version
          micromamba run -n seq-detective ninja --version
          make --version
          micromamba run -n seq-detective gcc --version
          micromamba run -n seq-detective g++ --version
          micromamba run -n seq-detective time --version
          micromamba run -n seq-detective fasterq-dump --version
      - name: verify libomp is installed
        if: runner.os == 'macOS'
        run: |
          micromamba run -n seq-detective micromamba list | grep openmp

          micromamba run -n seq-detective micromamba list | grep sra-tools
          
      - name: Build
        run: |
          # Adjust this command to match your project's build steps
          micromamba run -n seq-detective time -v sh -c '
          make
          meson compile -C build
          '
      - name: Archive build artifact for Linux
        uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: seq-detective-binary-linux
          compression-level: 6
          if-no-files-found: error
          path: |
            *
      - name: Archive build artifact for macOS 
        uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: seq-detective-binary-macos
          compression-level: 6
          if-no-files-found: error
          path: |
            *
      

      
  runtime:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
        python-version: ["3.10"]
    needs: build
    steps:
      - name: Check out repository 
        uses: actions/checkout@v4
       
      - name: Download compiled artifact for Linux
        uses: actions/download-artifact@v4
        if: runner.os == 'Linux'
        with: 
          name: seq-detective-binary-linux 
          path: . 
      
      - name: Download compiled artifact for macOS 
        uses: actions/download-artifact@v4
        if: runner.os == 'macOS'
        with: 
          name: seq-detective-binary-macos 
          path: . 
  

      - name: make binary executable
        run: chmod +x build/seq-detective-fp
     
      - name: Set up Conda env
        uses: mamba-org/setup-micromamba@v2 
        with:
          # generate-run-shell: true
          environment-name: seq-detective
          create-args: >-
            time
            llvm-openmp
          cache-environment: true
          post-cleanup: 'all'
  
      - name: ensure GNU time is installed
        run: | 
            micromamba run -n seq-detective time --version
      - name: ensure libomp is installed
        if: runner.os == 'macOS'
        run: | 
            micromamba run -n seq-detective micromamba list | grep openmp 
            ls /Users/runner/micromamba/envs/seq-detective/lib/libomp.dylib
     
      - name: List available test FASTQ files
        run: | 
          # echo "Available FASTQ files in resources/tests/500:"
          ls -l resources/tests/500/
      - name: Run tool on tests fastqs
        shell: bash -el {0}
        run: | 
          for file in resources/tests/500/*.fastq; do
            filename=$(echo "${file}"| awk -F/ '{print $5}')  
            echo "=== Running seq-detective on ${file} from ${PWD} ==="
             micromamba run -n seq-detective time -v build/seq-detective-fp ${file}
            echo "-------------------------------------"
            echo ""
          done
   
